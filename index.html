<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ギタリスト図鑑 | SingingBirds</title>
<style>
:root{
  --bg:#17140f;
  --bg2:#221d15;
  --paper:#f3ead8;
  --paper2:#e9dec6;
  --ink:#28211a;
  --ink2:#6b5d4a;
  --line:#cdbfa4;
  --gold:#c9a227;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 4px),
    radial-gradient(120% 80% at 50% 0%, #262016 0%, var(--bg) 60%);
  color:var(--paper);
  min-height:100vh;
  padding-bottom:40px;
}
.serif{font-family:"Hiragino Mincho ProN","Yu Mincho","Times New Roman",serif}

/* ---------- header ---------- */
header{
  text-align:center;
  padding:26px 16px 10px;
}
.hd-eyebrow{
  font-size:10px;letter-spacing:.35em;color:var(--gold);
  text-transform:uppercase;margin-bottom:6px;
}
h1{
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:30px;font-weight:600;letter-spacing:.14em;
}
.hd-sub{font-size:11px;color:#a8977c;letter-spacing:.18em;margin-top:6px}

/* ---------- tabs ---------- */
nav{
  display:flex;justify-content:center;gap:8px;
  padding:14px 16px 4px;position:sticky;top:0;z-index:20;
  background:linear-gradient(to bottom, rgba(23,20,15,.96) 70%, rgba(23,20,15,0));
}
.tab{
  border:1px solid #4a4232;background:transparent;color:#cbbc9e;
  font-size:13px;letter-spacing:.12em;padding:8px 18px;border-radius:999px;
  cursor:pointer;font-family:inherit;
}
.tab.on{background:var(--gold);border-color:var(--gold);color:#1c1710;font-weight:700}

/* ---------- filters ---------- */
.filters{max-width:640px;margin:10px auto 0;padding:0 16px}
.f-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.f-label{font-size:10px;letter-spacing:.2em;color:#8f8168;width:100%;margin-bottom:2px}
.chip{
  border:1px solid #453b2b;background:#211c14;color:#d8caac;
  font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer;font-family:inherit;
}
.chip.on{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:700}

/* ---------- card grid ---------- */
.grid{
  max-width:640px;margin:14px auto 0;padding:0 16px;
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{
  background:var(--paper);border-radius:var(--radius);overflow:hidden;
  color:var(--ink);cursor:pointer;border:0;text-align:left;font-family:inherit;
  box-shadow:0 4px 14px rgba(0,0,0,.45);
  transition:transform .12s ease;
  position:relative;
}
.card:active{transform:scale(.97)}
.card .fig{display:block;width:100%;background:var(--paper2)}
.card .meta{padding:9px 10px 11px;border-top:2px solid var(--ac,#888)}
.card .nm{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:15px;font-weight:700;letter-spacing:.04em}
.card .en{font-size:9px;letter-spacing:.14em;color:var(--ink2);text-transform:uppercase;margin-top:1px}
.card .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tg{
  font-size:9px;padding:2px 7px;border-radius:999px;
  background:rgba(0,0,0,.06);color:var(--ink2);letter-spacing:.05em;
}
.tg.ac{background:var(--ac);color:#fff}
.fav-mark{
  position:absolute;top:6px;right:8px;font-size:15px;color:var(--gold);
  text-shadow:0 1px 2px rgba(0,0,0,.3);
}
.empty{
  grid-column:1/-1;text-align:center;color:#8f8168;font-size:13px;
  padding:40px 0;letter-spacing:.1em;
}

/* ---------- detail ---------- */
.detail{max-width:640px;margin:12px auto 0;padding:0 16px}
.back{
  background:none;border:none;color:#cbbc9e;font-size:13px;cursor:pointer;
  padding:6px 0 12px;letter-spacing:.1em;font-family:inherit;
}
.sheet{
  background:var(--paper);color:var(--ink);border-radius:var(--radius);
  overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.5);
}
.hero{position:relative;background:var(--paper2)}
.hero svg{display:block;width:100%}
.hero .years{
  position:absolute;top:12px;left:14px;font-size:11px;letter-spacing:.2em;
  color:var(--ink2);
}
.fav-btn{
  position:absolute;top:8px;right:10px;background:none;border:none;
  font-size:24px;cursor:pointer;color:#b6a888;padding:4px;
}
.fav-btn.on{color:var(--gold)}
.d-head{padding:14px 18px 6px;border-top:3px solid var(--ac)}
.d-nm{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:24px;font-weight:700;letter-spacing:.05em}
.d-en{font-size:10px;letter-spacing:.22em;color:var(--ink2);text-transform:uppercase;margin-top:2px}
.d-catch{
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:14px;color:var(--ac);margin-top:8px;letter-spacing:.06em;
}
.d-tags{display:flex;flex-wrap:wrap;gap:5px;padding:8px 18px 0}
.d-body{padding:6px 18px 20px}
.sec{margin-top:18px}
.sec-t{
  font-size:11px;letter-spacing:.28em;color:var(--ac);font-weight:700;
  display:flex;align-items:center;gap:8px;margin-bottom:8px;
}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.d-prof{font-size:13.5px;line-height:1.85;color:#3a3227}
.dna-tags{display:flex;flex-wrap:wrap;gap:7px}
.dna-tg{
  font-size:12.5px;padding:6px 13px;border-radius:999px;
  border:1.6px solid;background:#fff;letter-spacing:.03em;font-weight:600;
}
.gear{font-size:13px;line-height:1.8;color:#3a3227}
.gear b{color:var(--ink)}
.song{
  display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);
  font-size:13px;align-items:baseline;
}
.song:last-child{border-bottom:none}
.song .no{
  font-family:"Hiragino Mincho ProN",serif;color:var(--ac);
  font-size:15px;font-weight:700;flex:0 0 18px;
}
.song .st{font-weight:700}
.song .sn{color:var(--ink2);font-size:12px;margin-top:2px}
.song>div{flex:1}
.beg{
  background:rgba(0,0,0,.05);border-left:3px solid var(--ac);
  padding:10px 12px;font-size:13px;line-height:1.7;border-radius:0 8px 8px 0;
}
.beg b{display:block}
.sim-row{display:flex;flex-wrap:wrap;gap:8px}
.sim{
  border:1px solid var(--line);background:#fff;color:var(--ink);
  font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;font-family:inherit;
}
.sim b{font-weight:700}
.infl{font-size:12.5px;line-height:1.8;color:#3a3227}
.infl b{color:var(--ac)}

/* ---------- tree ---------- */
.treewrap{max-width:640px;margin:14px auto 0;padding:0 16px}
.tree-note{font-size:12px;color:#a8977c;line-height:1.7;margin-bottom:10px}
.tl-era{position:relative;padding-left:26px;margin-bottom:26px}
.tl-era::before{content:"";position:absolute;left:7px;top:14px;bottom:-26px;width:2px;background:#4a4232}
.tl-era:last-child::before{bottom:12px}
.tl-era::after{content:"";position:absolute;left:2px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.25)}
.tl-head{margin-bottom:4px}
.tl-label{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:20px;letter-spacing:.18em;color:var(--gold)}
.tl-cap{font-size:11.5px;color:#a8977c;letter-spacing:.06em;margin-top:2px;line-height:1.6}
.tl-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
@media(min-width:520px){.tl-grid{grid-template-columns:1fr 1fr}}
.tcard{
  display:flex;align-items:center;gap:10px;text-align:left;
  background:var(--paper);color:var(--ink);border:0;border-left:4px solid var(--ac,#888);
  border-radius:10px;padding:7px 10px 7px 7px;cursor:pointer;font-family:inherit;
  box-shadow:0 3px 10px rgba(0,0,0,.35);transition:transform .1s;
}
.tcard:active{transform:scale(.98)}
.tcard .tfig{flex:0 0 46px;width:46px;border-radius:8px;overflow:hidden;background:var(--paper2)}
.tcard .tfig svg,.tcard .tfig img{display:block;width:100%}
.tcard .tnm{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:13.5px;font-weight:700}
.tcard .thito{font-size:10.5px;color:var(--ac);margin-top:1px}
.tcard .tyr{font-size:9.5px;color:var(--ink2);letter-spacing:.1em;margin-top:1px}

/* ---------- help ---------- */
.help{max-width:640px;margin:14px auto 0;padding:0 16px}
.h-card{
  background:var(--paper);color:var(--ink);border-radius:var(--radius);
  padding:18px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.4);
}
.h-card h2{
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:16px;letter-spacing:.1em;margin-bottom:10px;color:var(--ink);
  border-bottom:2px solid var(--gold);display:inline-block;padding-bottom:2px;
}
.h-card p,.h-card li{font-size:13px;line-height:1.9;color:#3a3227}
.h-card ul{padding-left:18px;margin-top:4px}
.h-card b{color:var(--ink)}
.search-row{gap:8px}
#search{
  flex:1;min-width:150px;background:#211c14;border:1px solid #453b2b;color:#e8dcc0;
  font-size:14px;padding:8px 14px;border-radius:999px;font-family:inherit;outline:none;
}
#search::placeholder{color:#7d7159}
#search:focus{border-color:var(--gold)}
.disc{
  border:1px solid var(--gold);background:transparent;color:var(--gold);
  font-size:12px;padding:7px 12px;border-radius:999px;cursor:pointer;font-family:inherit;white-space:nowrap;
}
.rc{
  border:1px solid #453b2b;background:#2a2318;color:#d8caac;
  font-size:11.5px;padding:4px 10px;border-radius:999px;cursor:pointer;font-family:inherit;
}
.card .hito{
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:11px;color:var(--ac);margin-top:3px;letter-spacing:.04em;
}
.dna-tg.tap{cursor:pointer;border-bottom:2px dotted currentColor}
.stars{color:var(--ac);letter-spacing:2px;font-size:13px}
.stars .off{color:#cdbfa4}
.listen{
  border:1px solid var(--ac);background:#fff;color:var(--ac);
  font-size:11px;padding:3px 10px;border-radius:999px;cursor:pointer;font-family:inherit;
  text-decoration:none;display:inline-block;white-space:nowrap;
}
.sim-item{display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap}
.sim-why{font-size:11px;color:var(--ink2)}
.sim-pct{font-weight:700;color:var(--ac);font-size:13px}
#tech-modal{
  position:fixed;inset:0;background:rgba(15,12,8,.6);z-index:50;display:none;
  align-items:center;justify-content:center;padding:20px;
}
#tech-modal.on{display:flex}
.tm-card{
  background:var(--paper);color:var(--ink);border-radius:var(--radius);
  max-width:420px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.6);
  max-height:80vh;overflow-y:auto;
}
.tm-card h3{
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:18px;
  border-bottom:2px solid var(--gold);display:inline-block;padding-bottom:2px;margin-bottom:10px;
}
.tm-sec{margin-top:10px}
.tm-sec b{font-size:11px;letter-spacing:.2em;color:#8a7a5f;display:block;margin-bottom:3px}
.tm-sec p{font-size:13px;line-height:1.8}
.tm-close{
  margin-top:14px;width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:9px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:13px;
}
.solo-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.solo-row:last-child{border-bottom:none}
.solo-fig{flex:0 0 40px;width:40px;border-radius:8px;overflow:hidden;background:var(--paper2)}
.solo-fig svg,.solo-fig img{display:block;width:100%}
.solo-t{font-weight:700;font-size:13.5px}
.solo-g{background:none;border:none;padding:0;color:var(--gold);font-size:12px;cursor:pointer;font-family:inherit;text-decoration:underline dotted}
.solo-n{font-size:12px;color:#3a3227;line-height:1.7;margin-top:2px}
.solo-rs{font-size:10.5px;color:#8a7a5f;margin-top:2px}
.solo-main{flex:1}
#aki-modal{position:fixed;inset:0;background:rgba(15,12,8,.65);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#aki-modal.on{display:flex}
.aki-card{background:var(--paper);color:var(--ink);border-radius:var(--radius);max-width:420px;width:100%;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.aki-card h3{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:17px;border-bottom:2px solid var(--gold);display:inline-block;padding-bottom:2px;margin-bottom:8px}
.aki-q{font-size:15px;line-height:1.8;margin:14px 0;min-height:3em}
.aki-count{font-size:10.5px;color:#8a7a5f;letter-spacing:.1em}
.aki-btns{display:flex;gap:8px;flex-wrap:wrap}
.aki-btns button{flex:1;min-width:90px;font-family:inherit;font-size:13.5px;padding:11px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.aki-btns button.main{background:var(--gold);border-color:var(--gold);font-weight:700}
.aki-result{text-align:center}
.aki-result .rfig{width:120px;margin:10px auto;border-radius:12px;overflow:hidden;background:var(--paper2)}
.aki-result .rfig svg,.aki-result .rfig img{display:block;width:100%}
.aki-others{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.view{display:none}
.view.on{display:block}
footer{
  text-align:center;margin-top:36px;font-size:10px;color:#6e6250;letter-spacing:.2em;
}
</style>
</head>
<body>

<header>
  <div class="hd-eyebrow">SingingBirds Guitar School</div>
  <h1>ギタリスト図鑑</h1>
  <div class="hd-sub">聴いて、知って、真似てみる。</div>
</header>

<nav>
  <button class="tab on" data-v="list">図鑑</button>
  <button class="tab" data-v="tree">年表</button>
  <button class="tab" data-v="solos">名ソロ</button>
  <button class="tab" data-v="help">使い方</button>
</nav>

<div id="v-list" class="view on">
  <div class="filters">
    <div class="f-row search-row">
      <input id="search" type="search" placeholder="名前・曲名・奏法・ギターで検索" autocomplete="off">
      <button class="disc" id="btn-today">今日の一人</button>
      <button class="disc" id="btn-random">ランダム</button>
      <button class="disc" id="btn-aki">ギタリスト診断</button>
    </div>
    <div class="f-row" id="recent-row" style="display:none"><span class="f-label">最近見た</span><span id="f-recent"></span></div>
    <div class="f-row"><span class="f-label">ERA — 年代</span><span id="f-era"></span></div>
    <div class="f-row"><span class="f-label">GENRE — ジャンル</span><span id="f-genre"></span></div>
    <div class="f-row"><span class="f-label">PLAY — 奏法</span><span id="f-tech"></span></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div id="v-detail" class="view"><div class="detail" id="detail"></div></div>

<div id="v-tree" class="view">
  <div class="treewrap">
    <p class="tree-note">戦前のデルタブルースから現代まで——ギターの歴史を年代順にたどる年表でございます。気になる人物をタップすると詳細ページへ移動します。<br>※ 誰が誰に影響を与えたかは、各人物の詳細ページの「影響関係」と「この人が好きなら」でご覧くださいませ。</p>
    <div id="tree"></div>
  </div>
</div>

<div id="v-solos" class="view"><div class="help" id="solos"></div></div>

<div id="v-help" class="view"><div class="help" id="help"></div></div>

<div id="aki-modal" role="dialog" aria-modal="true"><div class="aki-card" id="aki-body"></div></div>

<div id="tech-modal" role="dialog" aria-modal="true">
  <div class="tm-card">
    <h3 id="tm-title"></h3>
    <div class="tm-sec"><b>どんな奏法?</b><p id="tm-what"></p></div>
    <div class="tm-sec"><b>練習するなら</b><p id="tm-practice"></p></div>
    <div class="tm-sec"><b>聴くときの注目点</b><p id="tm-listen"></p></div>
    <button class="tm-close" id="tm-close">閉じる</button>
  </div>
</div>

<footer>GUITARIST ZUKAN v1.0 — SingingBirds</footer>

<script>
/* ============ DATA ============ */
/* 【イラストの割り当て方法】
   HTMLと同じ場所に images フォルダを作り、人物IDと同名の画像を置くだけで自動的に使われます。
     例: images/clapton.webp (なければ images/clapton.png も試します)
   画像が無い人物は内蔵のシルエットが表示されます。推奨サイズは縦横比4:5(例:480×600px)。
   ※ 個別に img:"..." を指定した場合はそちらが最優先(base64埋め込みも可)。人物IDは各データの id: の値。 */
const G = [
{
 id:"clapton", nm:"エリック・クラプトン", en:"Eric Clapton",
 years:"1945–", country:"英", era:["60s","70s"], genre:["Blues","Rock"],
 ac:"#4a6fa5",
 catch:"「スローハンド」— 歌うように泣くブルースの王道。",
 hito:"歌うペンタの王道", tech:["チョーキング","ビブラート","リフ"], lv:2,
 prof:"ヤードバーズ、クリームを経てソロへ。黒人ブルースへの深い敬愛を土台に、ロックの文脈でブルースギターの美しさを世界に広めた代表的存在。派手さよりも一音の説得力で聴かせる、ペンタトニックの教科書のような存在でございます。",
 dnaTags:["ペンタトニックの王道","泣きのチョーキング","ウーマントーン","歌に寄り添うオブリガード"],
 gear:{g:"Fender Stratocaster「Blackie」/ Gibson Les Paul・SG(クリーム期)",a:"Marshall(クリーム期)→ Fender系クリーントーン",s:"ミッド豊かな甘いトーン。クリーム期はウーマントーンと呼ばれる蜜のような歪みが有名。"},
 songs:[
  {t:"Crossroads (Cream)",n:"ロバート・ジョンソンのカバー。ライブソロはロック史の金字塔"},
  {t:"Layla",n:"デレク&ザ・ドミノス。哀切のリフが名高い(スライドはデュアン・オールマンとの共演)"},
  {t:"Tears in Heaven",n:"アコースティックの名曲。指弾きの教材としても定番"}
 ],
 beg:{t:"Wonderful Tonight",n:"ゆったりしたテンポで、チョーキングの音程感とビブラートを学ぶのに最適の一曲でございます。"},
 sim:["bbking","srv","gilmour","beck"],
 inflFrom:"ロバート・ジョンソン、B.B.キング、バディ・ガイ、フレディ・キング",
 inflTo:"エディ・ヴァン・ヘイレン、Char、後のブルースロック全般"
},
{
 id:"hendrix", nm:"ジミ・ヘンドリックス", en:"Jimi Hendrix",
 years:"1942–1970", country:"米", era:["60s"], genre:["Rock","Blues"],
 ac:"#8a4fd3",
 catch:"エレキギターの可能性を一人で書き換えた革命家。",
 hito:"自由の源流", tech:["チョーキング","カッティング","リフ","ファンク"], lv:2,
 prof:"わずか4年ほどの活動でエレクトリックギターの表現を大きく塗り替えた天才。コードとリードを同時に紡ぐ親指を使ったコードワーク、フィードバックやアーミングまで音楽にした自由さは、今なお多くのギタリストにとっての源流とされております。",
 dnaTags:["親指フレットのコードワーク","ダブルストップ","フィードバック&アーム","リズムとリードの融合"],
 gear:{g:"Fender Stratocaster(右利き用を逆さに構えて使用)",a:"Marshall大音量",s:"Fuzz Face、Uni-Vibe、ワウを駆使したサイケデリックで肉感的なサウンド。"},
 songs:[

const IMG_DIR="images/";
function figHTML(g,big){
  const st=`display:block;width:100%;${big?"":"aspect-ratio:108/140;object-fit:cover;"}`;
  if(g.img){return `<img src="${g.img}" alt="${g.nm}のイラスト" style="${st}">`;}
  // images/{id}.webp → images/{id}.png → 内蔵シルエット の順に自動フォールバック
  const auto=`<img src="${IMG_DIR}${g.id}.webp" alt="${g.nm}のイラスト" style="${st}" data-step="0"
    onerror="if(this.dataset.step==='0'){this.dataset.step='1';this.src=this.src.replace(/\.webp$/,'.png');}else{this.style.display='none';var s=this.nextElementSibling;if(s)s.style.display='';}">`;
  return auto+figSVG(g,big).replace("<svg ",'<svg style="display:none" ');
}
function figSVG(g,big){
  const vb = big ? "0 0 120 150" : "6 4 108 140";
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${g.nm}のイラスト">
  <circle cx="60" cy="76" r="52" fill="${g.ac}" opacity=".16"/>
  <circle cx="60" cy="76" r="38" fill="${g.ac}" opacity=".12"/>
  <ellipse cx="60" cy="137" rx="33" ry="4.5" fill="rgba(0,0,0,.14)"/>
  ${SIL[g.id](g.ac)}
  </svg>`;
}

const TECHS=["チョーキング","ビブラート","カッティング","タッピング","スライド","指弾き","アルペジオ","リフ","速弾き","空間系","ファンク","スラップ"];

function techKey(tag){
  const map=[["チョーキング","チョーキング"],["ベンド","チョーキング"],["ビブラート","ビブラート"],["カッティング","カッティング"],["チャッキング","カッティング"],["タッピング","タッピング"],["スライド","スライド"],["指弾き","指弾き"],["フィンガー","指弾き"],["ピックレス","指弾き"],["ピックを使わない","指弾き"],["アルペジオ","アルペジオ"],["リフ","リフ"],["速弾き","速弾き"],["フルピッキング","速弾き"],["超絶","速弾き"],["ディレイ","空間系"],["空間","空間系"],["エコー","空間系"],["ファンク","ファンク"],["スラップ","スラップ"]];
  for(const[k,v]of map){if(tag.includes(k))return v;}
  return null;
}

const ERAS=["戦前","50s","60s","70s","80s","90s","00s","10s〜"];

function chip(label,on,fn){
  const b=document.createElement("button");
  b.className="chip"+(on?" on":"");b.textContent=label;b.onclick=fn;return b;
}
function renderFilters(){
  const fe=document.getElementById("f-era");fe.innerHTML="";
  fe.className="f-row";
  ERAS.forEach(e=>fe.appendChild(chip(e,state.era===e,()=>{state.era=state.era===e?null:e;renderList();})));
  const fg=document.getElementById("f-genre");fg.innerHTML="";
  fg.className="f-row";
  GENRES.forEach(gn=>fg.appendChild(chip(gn,state.genre===gn,()=>{state.genre=state.genre===gn?null:gn;renderList();})));
  fg.appendChild(chip("★ お気に入り",state.favOnly,()=>{state.favOnly=!state.favOnly;renderList();}));
  const ft=document.getElementById("f-tech");ft.innerHTML="";
  ft.className="f-row";
  TECHS.forEach(t=>ft.appendChild(chip(t,state.tech===t,()=>{state.tech=state.tech===t?null:t;renderList();})));
  const recent=recentStore.get().filter(id=>G.some(g=>g.id===id));
  const row=document.getElementById("recent-row");
  const fr=document.getElementById("f-recent");fr.innerHTML="";fr.className="f-row";
  if(recent.length){
    row.style.display="";
    recent.forEach(id=>{
      const g=G.find(x=>x.id===id);
      const b=document.createElement("button");b.className="rc";b.textContent=g.nm;
      b.onclick=()=>showDetail(id);fr.appendChild(b);
    });
  }else{row.style.display="none";}
}
function matchQ(g,q){
  if(!q)return true;
  const hay=[g.nm,g.en,g.hito,g.catch,g.years,g.country,
    ...g.genre,...g.era,...g.dnaTags,...g.tech,
    ...g.songs.map(x=>x.t),g.beg.t,g.gear.g,g.gear.a,g.gear.s].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
}
function renderList(){
  renderFilters();
  const grid=document.getElementById("grid");grid.innerHTML="";
  const list=G.filter(g=>
    (!state.era||g.era.includes(state.era))&&
    (!state.genre||g.genre.includes(state.genre))&&
    (!state.tech||g.tech.includes(state.tech))&&
    (!state.favOnly||isFav(g.id))&&
    matchQ(g,state.q)
  );
  if(!list.length){grid.innerHTML=`<div class="empty">該当するギタリストがおりません。<br>条件を変えてお探しくださいませ。</div>`;return;}
  list.forEach(g=>{
    const c=document.createElement("button");
    c.className="card";c.style.setProperty("--ac",g.ac);
    c.innerHTML=`
      <div class="fig">${figHTML(g,false)}</div>
      ${isFav(g.id)?'<div class="fav-mark">★</div>':""}
      <div class="meta">
        <div class="nm">${g.nm}</div>
        <div class="en">${g.en}</div>
        <div class="hito">${g.hito}</div>
        <div class="tags">
          <span class="tg ac">${g.genre[0]}</span>
          <span class="tg">${g.era.join("・")}</span>
        </div>
      </div>`;
    c.onclick=()=>showDetail(g.id);
    grid.appendChild(c);
  });
}

function ytLink(g,title){
  return "https://www.youtube.com/results?search_query="+encodeURIComponent(g.en.replace(/\s*\(.+\)$/,"")+" "+title);
}
function stars(lv){
  let out="";
  for(let i=1;i<=5;i++)out+=i<=lv?"★":'<span class="off">☆</span>';
  return `<span class="stars">${out}</span>`;
}
function simScore(a,b){
  const st=a.tech.filter(t=>b.tech.includes(t));
  const sg=a.genre.filter(t=>b.genre.includes(t));
  const se=a.era.some(e=>b.era.includes(e));
  let score=55+st.length*9+sg.length*7+(se?4:0);
  score=Math.max(62,Math.min(97,score));
  let why=[];
  if(st.length)why.push("奏法: "+st.slice(0,3).join("・"));
  if(sg.length)why.push("ジャンル: "+sg.join("・"));
  if(!why.length)why.push("系譜上のつながり");
  return {score,why:why.join(" / ")};
}

const AKI_FEATURES=[
 {q:"日本のギタリストですか?",f:g=>g.country.includes("日")},
 {q:"女性のギタリストですか?",f:g=>["raitt","orianthi"].includes(g.id)},
 {q:"すでに亡くなっている方ですか?",f:g=>/–(19|20)\d{2}/.test(g.years)},
 {q:"活躍の始まりは60年代以前ですか?",f:g=>["戦前","50s","60s"].includes(g.era[0])},
 {q:"2000年代以降に登場した人ですか?",f:g=>["00s","10s〜"].includes(g.era[0])},
 {q:"メタルやハードロックのイメージが強いですか?",f:g=>g.genre.includes("Metal")||g.genre.includes("Hard Rock")},
 {q:"ジャズやフュージョンの人ですか?",f:g=>g.genre.includes("Jazz")||g.genre.includes("Fusion")},
 {q:"ブルースが音楽の核にありますか?",f:g=>g.genre.includes("Blues")},
 {q:"ファンクやカッティングの名手ですか?",f:g=>g.genre.includes("Funk")||g.tech.includes("カッティング")},
 {q:"速弾きの技巧派ですか?",f:g=>g.tech.includes("速弾き")},
 {q:"スライドギターを操りますか?",f:g=>g.tech.includes("スライド")},
 {q:"ピックを使わず指で弾くイメージがありますか?",f:g=>g.tech.includes("指弾き")||g.tech.includes("スラップ")},
 {q:"空間系エフェクト(ディレイ等)が持ち味ですか?",f:g=>g.tech.includes("空間系")},
 {q:"特定のバンドの一員として有名ですか?",f:g=>/[(（]/.test(g.en)},
 {q:"チョーキングやビブラートの「泣き」の人ですか?",f:g=>g.tech.includes("チョーキング")&&g.tech.includes("ビブラート")}
];
let aki={rest:[],used:[],count:0,cur:null,prev:[]};
function akiStart(){
  aki={rest:[...G],used:[],count:0,cur:null,prev:[]};
  akiNext();
  document.getElementById("aki-modal").classList.add("on");
}
function akiPick(){
  let best=null,bestScore=1e9;
  AKI_FEATURES.forEach((ft,i)=>{
    if(aki.used.includes(i))return;
    const yes=aki.rest.filter(ft.f).length;
    if(yes===0||yes===aki.rest.length)return;
    const score=Math.abs(yes-aki.rest.length/2);
    if(score<bestScore){bestScore=score;best=i;}
  });
  return best;
}
function akiNext(){
  if(aki.rest.length<=1||aki.count>=8){akiResult();return;}
  const i=akiPick();
  if(i===null){akiResult();return;}
  aki.cur=i;
  const el=document.getElementById("aki-body");
  el.innerHTML=`<h3>ギタリスト診断</h3>
   <div class="aki-count">質問 ${aki.count+1} ・ 候補 ${aki.rest.length}名</div>
   <div class="aki-q">${AKI_FEATURES[i].q}</div>
   <div class="aki-btns">
    <button class="main" data-a="yes">はい</button>
    <button data-a="no">いいえ</button>
    <button data-a="skip">わからない</button>
   </div>
   <div class="aki-btns" style="margin-top:8px"><button data-a="quit">やめる</button></div>`;
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>akiAnswer(b.dataset.a));
}
function akiAnswer(a){
  if(a==="quit"){document.getElementById("aki-modal").classList.remove("on");return;}
  const ft=AKI_FEATURES[aki.cur];
  aki.used.push(aki.cur);
  if(a!=="skip"){
    aki.prev=aki.rest;
    const next=aki.rest.filter(g=>ft.f(g)===(a==="yes"));
    aki.rest=next.length?next:aki.rest; // 全滅する回答は無効化して続行
  }
  aki.count++;
  akiNext();
}
function akiResult(){
  const el=document.getElementById("aki-body");
  const cands=aki.rest.length?aki.rest:aki.prev;
  const top=cands[0];
  if(!top){el.innerHTML=`<h3>ギタリスト診断</h3><div class="aki-q">当てはまる人が見つかりませんでした。もう一度お試しくださいませ。</div><div class="aki-btns"><button class="main" data-a="re">もう一度</button><button data-a="quit">閉じる</button></div>`;}
  else{
    const others=cands.slice(1,4);
    el.innerHTML=`<div class="aki-result"><h3>ギタリスト診断</h3>
     <div class="aki-q">思い浮かべたのは——<br><b style="font-size:19px">${top.nm}</b><br><span style="font-size:12px;color:#8a7a5f">${top.hito}</span></div>
     <div class="rfig">${figHTML(top,false)}</div>
     <div class="aki-btns"><button class="main" data-go="${top.id}">この人のページを見る</button></div>
     ${others.length?`<div style="font-size:11px;color:#8a7a5f;margin-top:12px">ちがう場合、この方々かもしれません:</div>
     <div class="aki-others">${others.map(o=>`<button class="sim" data-go="${o.id}">${o.nm}</button>`).join("")}</div>`:""}
     <div class="aki-btns" style="margin-top:12px"><button data-a="re">もう一度</button><button data-a="quit">閉じる</button></div>
    </div>`;
  }
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{document.getElementById("aki-modal").classList.remove("on");showDetail(b.dataset.go);});
  el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(b.dataset.a==="re")akiStart();else document.getElementById("aki-modal").classList.remove("on");});
}

    <p style="margin-top:8px"><b>入り口の一曲</b>には難易度の目安(★1〜5)を添えております。★1=単音リフやコード数個から / ★3=要練習の定番 / ★5=原曲再現は上級者向け、という目安で、当教室の見立てでございます。</p>
    <p style="margin-top:8px"><b>この人が好きなら</b>の%は、奏法・ジャンルなどの共通点から算出した「近さの目安」でございます。優劣の点数ではございません。</p>
  </div>
  <div class="h-card"><h2>イラストについて</h2>
    <p>本図鑑の人物画像は、肖像権・著作権に配慮し、実在の写真ではなく<b>オリジナルのイラスト</b>で統一しております。特徴的な髪型・帽子・ギターのかたちで「らしさ」をお楽しみくださいませ。</p>
    <p style="margin-top:8px">手描きイラストは順次差し替えてまいります(画像が未登録の人物は自動生成のシルエットで表示されます)。</p>
    <p style="margin-top:8px">また、機材は時期により変わるため<b>「代表的な機材」</b>として記載しております。楽曲欄には本人以外の作曲によるものも「代表的な演奏」として含み、その場合は作者を明記するよう努めております。</p>
  </div>`;
}

/* ============ VIEW SWITCH / INIT ============ */
function switchView(v){
  state.view=v;
  document.querySelectorAll(".view").forEach(el=>el.classList.remove("on"));
  const target = v==="detail" ? "v-detail" : "v-"+v;
  document.getElementById(target).classList.add("on");
  document.querySelectorAll(".tab").forEach(t=>{
    t.classList.toggle("on", t.dataset.v===v || (v==="detail"&&t.dataset.v==="list"));
  });
  if(v==="list")renderList();
}
function openTech(key){
  const info=TECH_INFO[key];if(!info)return;
  document.getElementById("tm-title").textContent=key;
  document.getElementById("tm-what").textContent=info.w;
  document.getElementById("tm-practice").textContent=info.p;
  document.getElementById("tm-listen").textContent=info.l;
  document.getElementById("tech-modal").classList.add("on");
}
document.getElementById("tm-close").onclick=()=>document.getElementById("tech-modal").classList.remove("on");
document.getElementById("tech-modal").addEventListener("click",e=>{if(e.target.id==="tech-modal")e.target.classList.remove("on");});

document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value;renderList();});
document.getElementById("btn-random").onclick=()=>{
  const g=G[Math.floor(Math.random()*G.length)];showDetail(g.id);
};
document.getElementById("btn-today").onclick=()=>{
  const d=new Date();
  const seed=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  const g=G[seed%G.length];showDetail(g.id);
};

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>switchView(t.dataset.v));
document.getElementById("btn-aki").onclick=akiStart;
document.getElementById("aki-modal").addEventListener("click",e=>{if(e.target.id==="aki-modal")e.target.classList.remove("on");});
renderList();renderTimeline();renderSolos();renderHelp();
</script>
</body>
</html>
